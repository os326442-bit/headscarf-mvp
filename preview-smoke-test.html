<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>בדיקת הדמיית מטפחת</title>
<style>body{font-family:Arial,sans-serif;background:#f9f0ed;color:#473f3c;margin:0;padding:24px}main{max-width:800px;margin:auto}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}label{display:grid;gap:6px}select{padding:10px;border:1px solid #d5b9af;border-radius:10px;background:white}#result{display:block}.final-preview{background:#fff8f5;border-radius:20px;padding:14px}#finalScarf{min-height:30px}</style>
</head>
<body><main><h1>בדיקת הדמיה — ענף פיתוח בלבד</h1><p>כלי בדיקה פנימי שאינו חלק מתהליך העיצוב של הלקוחות.</p>
<div class="controls"><label>צורה<select id="shape"><option>משולש</option><option>בנדנה</option><option>לונג</option><option>סרט</option><option>קשת</option></select></label>
<label>תבנית<select id="pattern"><option value="single">בד אחד</option><option value="a">שני בדים</option><option value="b">שלושה בדים</option></select></label>
<label>גימור<select id="finish"><option>נקי</option><option>פרנזים</option><option>שרשרת</option><option>נזר בד</option></select></label></div>
<div class="controls"><label>בד ראשון<select id="fabric0"></select></label><label>בד שני<select id="fabric1"></select></label><label>בד שלישי<select id="fabric2"></select></label></div>
<section id="result" class="active"><div class="final-preview"><div id="finalScarf">הדמיית הגיבוי לקשת</div></div></section>
<p>גררי את המטפחת ימינה או שמאלה כדי לבדוק סיבוב.</p></main>
<script>
const samples=[['base:ורוד','#c48e93'],['base:מרווה','#71806a'],['base:שמנת','#e6dccb'],['print:פרחוני','data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="#d3a5a0"/><circle cx="20" cy="20" r="13" fill="#fff1d8"/><circle cx="55" cy="55" r="13" fill="#fff1d8"/></svg>')],['lace:תחרה שמנת','data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="#e6dccb"/><circle cx="40" cy="40" r="23" fill="none" stroke="#b9a992" stroke-width="5"/></svg>')]];
const state={shape:'משולש',pattern:'single',finish:'נקי',fabrics:[]};
function fabricVisual(item){return samples.find(x=>x[0]===item)?.[1]||''}
for(let i=0;i<3;i++){const el=document.getElementById('fabric'+i);el.innerHTML=samples.map(([name])=>'<option value="'+name+'">'+name+'</option>').join('');el.selectedIndex=i;el.addEventListener('change',sync)}
for(const id of ['shape','pattern','finish'])document.getElementById(id).addEventListener('change',sync);
function sync(){state.shape=document.getElementById('shape').value;state.pattern=document.getElementById('pattern').value;state.finish=document.getElementById('finish').value;state.fabrics=[0,1,2].map(i=>document.getElementById('fabric'+i).value)}
sync();
</script><script src="preview-bridge.js"></script></body></html>
