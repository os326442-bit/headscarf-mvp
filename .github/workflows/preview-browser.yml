name: Scarf preview browser QA
on:
  pull_request:
    paths:
      - 'preview-bridge.js'
      - 'preview-smoke-test.html'
      - 'tests/preview-browser.cjs'
      - '.github/workflows/preview-browser.yml'
  workflow_dispatch:
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run browser QA
        run: node tests/preview-browser.cjs
